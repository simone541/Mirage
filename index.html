<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#050505">
  <meta name="description" content="MIRAGE Biella — Eventi, musica e nightlife.">
  <title>MIRAGE | Biella · Italy</title>

  <style>
    :root {
      --bg: #050505;
      --cyan: #00f5ff;
      --magenta: #ff00d4;
      --white: #f8f8ff;
    }

    * {
      box-sizing: border-box;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      margin: 0;
      min-height: 100vh;
      background:
        radial-gradient(ellipse at 50% 35%,
          rgba(255, 0, 212, 0.09), transparent 48%),
        var(--bg);
      color: var(--white);
      font-family: Arial, Helvetica, sans-serif;
      text-align: center;
    }

    header {
      padding: 24px 18px 12px;
    }

    /* Mantieni qui il percorso del logo originale.
       Non modificare il file del logo esistente. */
    .logo {
      display: block;
      width: min(72%, 320px);
      max-height: 240px;
      object-fit: contain;
      margin: 10px auto 20px;
    }

    .location {
      color: var(--cyan);
      font-size: 0.8rem;
      letter-spacing: 0.32em;
      text-transform: uppercase;
      text-shadow: 0 0 12px rgba(0, 245, 255, 0.7);
    }

    main {
      width: min(100% - 32px, 760px);
      margin: 0 auto;
      padding: 35px 0 70px;
    }

    h1 {
      margin: 12px 0;
      font-size: clamp(2.5rem, 10vw, 5rem);
      letter-spacing: 0.12em;
      color: var(--white);
      text-shadow:
        0 0 8px var(--cyan),
        0 0 25px rgba(0, 245, 255, 0.5);
    }

    .subtitle {
      margin: 0 auto 34px;
      color: #c9c9d5;
      letter-spacing: 0.12em;
      line-height: 1.8;
      font-size: 0.9rem;
    }

    .neon-line {
      width: min(220px, 65%);
      height: 2px;
      margin: 25px auto;
      background: linear-gradient(
        90deg, transparent, var(--magenta), var(--cyan), transparent
      );
      box-shadow: 0 0 14px rgba(255, 0, 212, 0.55);
    }

    .social-title {
      color: var(--magenta);
      font-size: 0.8rem;
      letter-spacing: 0.25em;
      text-transform: uppercase;
      margin: 30px 0 18px;
    }

    .social-link {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 10px;
      min-width: 210px;
      padding: 15px 24px;
      border: 1px solid var(--magenta);
      border-radius: 6px;
      color: var(--white);
      text-decoration: none;
      font-size: 0.95rem;
      letter-spacing: 0.08em;
      background: rgba(255, 0, 212, 0.06);
      box-shadow:
        0 0 12px rgba(255, 0, 212, 0.15),
        inset 0 0 12px rgba(255, 0, 212, 0.04);
      transition: transform 0.2s ease, box-shadow 0.2s ease;
    }

    .social-link:hover,
    .social-link:focus-visible {
      transform: translateY(-2px);
      outline: none;
      box-shadow:
        0 0 22px rgba(255, 0, 212, 0.4),
        0 0 10px rgba(0, 245, 255, 0.2);
    }

    .instagram-icon {
      width: 21px;
      height: 21px;
      flex-shrink: 0;
    }

    footer {
      padding: 24px 16px 30px;
      border-top: 1px solid rgba(0, 245, 255, 0.15);
      color: #858592;
      font-size: 0.72rem;
      letter-spacing: 0.12em;
    }

    footer span {
      color: var(--cyan);
    }

    @media (prefers-reduced-motion: reduce) {
      html {
        scroll-behavior: auto;
      }

      *, *::before, *::after {
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>

<body>
  <header>
    <!-- IMPORTANTE:
         Sostituisci "logo-originale.png" con il nome ESATTO
         del file del tuo logo già presente nel repository.
         Non cambiare né ridisegnare il logo. -->
    <img
      class="logo"
      src="logo-originale.png"
      alt="Logo MIRAGE"
    >

    <div class="location">BIELLA · ITALY</div>
  </header>

  <main>
    <h1>MIRAGE</h1>

    <div class="neon-line"></div>

    <p class="subtitle">
      MUSIC · EVENTS · NIGHTLIFE
      <br>
      Il tuo punto di riferimento per le serate.
    </p>

    <section aria-label="Profili social">
      <p class="social-title">Seguici sui social</p>

      <a
        class="social-link"
        href="https://www.instagram.com/themirage_official/"
        target="_blank"
        rel="noopener noreferrer"
        aria-label="Apri il profilo Instagram ufficiale MIRAGE"
      >
        <svg
          class="instagram-icon"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="1.8"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="3" y="3" width="18" height="18" rx="5"/>
          <circle cx="12" cy="12" r="4"/>
          <circle cx="17.5" cy="6.5" r="0.8" fill="currentColor"/>
        </svg>
        INSTAGRAM
      </a>
    </section>
  </main>

  <footer>
    <span>MIRAGE</span> · BIELLA · ITALY
  </footer>
</body>
</html>
